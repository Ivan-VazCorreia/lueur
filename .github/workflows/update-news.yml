name: Mettre à jour les infos

on:
  schedule:
    - cron: "15 5 * * *"   # chaque jour à 5 h 15 UTC (6 h 15 à Paris en hiver, 7 h 15 en été)
  workflow_dispatch:         # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Récupérer les bonnes nouvelles
        run: node scripts/fetch-news.mjs
        env:
          DEEPL_KEY: ${{ secrets.DEEPL_KEY }}   # facultatif : traduit les articles anglais en français

      - name: Enregistrer news.json
        run: |
          git config user.name "lueur-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "Rien de nouveau aujourd'hui."
          else
            git commit -m "Infos du $(date -u +%d/%m/%Y)"
            git push
          fi
